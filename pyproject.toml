[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "battery-optimizer"
version = "1.0.0"
description = "A Shiny for Python decision support tool for LP-based NMC electric vehicle battery recycling supply chain scenario evaluation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "TODO_AUTHOR_FULL_NAME", email = "TODO_AUTHOR_EMAIL" }
]
keywords = [
    "linear programming",
    "battery recycling",
    "NMC battery",
    "electric vehicle battery waste",
    "reverse logistics",
    "supply chain optimization",
    "decision support system",
    "Shiny for Python",
    "SoftwareX"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Information Analysis"
]
dependencies = [
    "shiny>=0.9.0",
    "pandas>=2.0.0,<2.3.0",
    "numpy>=1.26.0,<2.0",
    "openpyxl>=3.1.0",
    "xlsxwriter>=3.1.0",
    "pulp>=2.7.0,<4.0",
    "matplotlib>=3.7.0",
    "plotly>=5.18.0",
    "jinja2>=3.1.0"
]

[project.optional-dependencies]
test = [
    "pytest>=7.4.0"
]
dev = [
    "pytest>=7.4.0",
    "build>=1.0.0"
]

[project.urls]
Homepage = "TODO_REPOSITORY_URL"
Repository = "TODO_REPOSITORY_URL"
Issues = "TODO_REPOSITORY_URL/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "ignore:LpVariable.dicts is deprecated:DeprecationWarning",
    "ignore:Using LpProblem.constraints as a dict mapping is deprecated:DeprecationWarning"
]